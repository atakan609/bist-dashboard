name: Update BIST Market & Portfolio Data

on:
  schedule:
    # Hafta içi her gün Türkiye saatiyle 18:30 (BIST kapanışı sonrası) -> UTC 15:30
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Manuel çalıştırma butonu

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Fetch Latest Market & Portfolio Data
        run: |
          python scripts/build_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update BIST market and portfolio data [skip ci]" && git push)
